version: 2

models:
  - name: stg_orders
    description: "Cleaned, typed orders data from the raw source."
    columns:
      - name: order_id
        description: "Unique identifier for each order."
        tests:
          - unique
          - not_null

  - name: stg_deliveries
    columns:
      - name: order_id
        tests:
          - not_null
          - relationships:
              to: ref('stg_orders')
              field: order_id